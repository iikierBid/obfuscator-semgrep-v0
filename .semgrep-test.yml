# Teste incremental - apenas SQL Injection
# Primeiro teste para verificar conflitos com p/default

rules:
  # ================================
  # 1. SQL INJECTION RULES
  # ================================
  - id: custom-sql-injection-detection
    patterns:
      - pattern-either:
          - pattern: |
              "SELECT * FROM $...TABLE WHERE $...COLUMN = " + $INPUT
          - pattern: |
              "INSERT INTO $...TABLE ($...COLUMNS) VALUES ('" + $INPUT + "')"
          - pattern: |
              "UPDATE $...TABLE SET $...COLUMN = '" + $INPUT + "'"
          - pattern: |
              "DELETE FROM $...TABLE WHERE $...COLUMN = '" + $INPUT + "'"
          - pattern: |
              `SELECT * FROM $...TABLE WHERE $...COLUMN = '${$INPUT}'`
          - pattern: |
              `INSERT INTO $...TABLE ($...COLUMNS) VALUES ('${$INPUT}')`
          - pattern: |
              `UPDATE $...TABLE SET $...COLUMN = '${$INPUT}'`
          - pattern: |
              `DELETE FROM $...TABLE WHERE $...COLUMN = '${$INPUT}'`
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada!
      
      A construção de queries SQL através de concatenação direta permite que atacantes
      injetem código SQL malicioso, comprometendo a segurança do banco de dados.
      
      ✅ Soluções recomendadas:
      1. Prepared Statements: db.query("SELECT * FROM users WHERE id = ?", [userInput])
      2. ORMs seguros: User.findOne({ where: { id: userInput } })
      3. Validação rigorosa de entradas
      
      📚 OWASP A03:2021 - Injection | CWE-89
    languages:
      - javascript
      - typescript
         severity: ERROR

  # ================================
  # 2. HARDCODED CREDENTIALS
  # ================================
  - id: hardcoded-credentials-js
    patterns:
      - pattern-either:
          - pattern: |
              const $VAR = "$...PASSWORD"
          - pattern: |
              const $VAR = "$...SECRET"
          - pattern: |
              const $VAR = "$...KEY"
          - pattern: |
              const $VAR = "$...TOKEN"
          - pattern: |
              const $VAR = "$...API"
          - pattern: |
              var $VAR = "$...PASSWORD"
          - pattern: |
              var $VAR = "$...SECRET"
          - pattern: |
              let $VAR = "$...PASSWORD"
          - pattern: |
              let $VAR = "$...SECRET"
    message: |
      🚨 CREDENCIAL HARDCODED DETECTADA!
      
      Credenciais sensíveis hardcoded no código representam um risco crítico de segurança.
      
      ⚠️ Riscos:
      • Exposição no controle de versão
      • Acesso não autorizado
      • Violação de compliance
      
      ✅ Soluções:
      1. Usar variáveis de ambiente: process.env.DB_PASSWORD
      2. Vaults seguros: HashiCorp Vault, AWS Secrets Manager
      3. Nunca commitar credenciais reais
      
      📚 OWASP A07:2021 - Identification and Authentication | CWE-798
    languages:
      - javascript
      - typescript
    severity: ERROR 