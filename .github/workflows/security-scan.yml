# Nome do Workflow para identificação na interface do GitHub Actions
name: 'Security Scan - Semgrep'

# Define os gatilhos (triggers) que iniciarão este workflow.
on:
  # Executa em todo push para qualquer branch
  push:
  # Executa em toda abertura ou atualização de um Pull Request.
  pull_request:
    branches: [ main, master ]
  # Permite a execução manual pela interface do GitHub Actions.
  workflow_dispatch:

# Define os jobs que serão executados.
jobs:
  semgrep_scan:
    # Nome do job, que aparecerá na UI do GitHub.
    name: 'Semgrep Scan and Generate HTML Report'
    # O job rodará na versão mais recente do Ubuntu fornecida pelo GitHub.
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Run Semgrep Scan'
        id: semgrep_scan
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep \
            semgrep scan --config "p/default" --config .semgrep.yml --sarif -o semgrep-results.sarif --error src/
          SEMGREP_EXIT_CODE=$?
          echo "exit_code=$SEMGREP_EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: 'Import Scan to DefectDojo'
        # Este step é executado independentemente de erros no scan,
        # para garantir que os resultados sejam sempre importados.
        if: always()
        run: |
          # Instala dependências do Python
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
          # Executa o script de importação
          python3 scripts/import_semgrep_scans.py --report-file semgrep-results.sarif
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 'Check for vulnerabilities and fail workflow'
        if: steps.semgrep_scan.outputs.exit_code == '1'
        run: |
          echo "::error::O PR foi recusado pois ha vulnerabilidades criticas a serem resolvidas."
          exit 1