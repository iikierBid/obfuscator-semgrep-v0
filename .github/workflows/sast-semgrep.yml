name: SAST Security Analysis with Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  semgrep-sast-scan:
    runs-on: ubuntu-latest
    name: Semgrep SAST Scan
    permissions:
      security-events: write
      contents: read
      pull-requests: write # Necessário para adicionar o comentário no PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Scan
        id: semgrep_scan
        run: |
          pip install semgrep
          semgrep ci --config="p/security-audit" --config="p/owasp-top-ten" --config="p/cwe-top-25" --config="auto" --sarif --output="semgrep.sarif"
          
      - name: Upload SARIF report to GitHub Security
        # Executa sempre, mas só terá efeito se o arquivo for gerado.
        # Principalmente útil para visualizar os resultados na aba "Security".
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: Comment PR on Failure
        # Executa apenas se um passo anterior falhou E o evento é um pull request.
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ❌ Falha na Análise de Segurança (SAST)
            
            **O merge foi bloqueado** devido a vulnerabilidades críticas ou de alta severidade encontradas pelo Semgrep.
            
            📋 Verifique os detalhes na aba [Security](https://github.com/${{ github.repository }}/security/code-scanning) do repositório para entender e corrigir os problemas.
            
            ### ⚠️ Ação Necessária
            - **Não faça o merge deste Pull Request.**
            - Corrija as vulnerabilidades apontadas.
            - Faça um novo push para esta branch para re-executar a análise.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    needs: [semgrep-sast-scan] # Agora depende do job de scan unificado
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add execute permission to obfuscator
        run: chmod +x ./node_modules/.bin/javascript-obfuscator

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages [skip ci]'
          full_commit_message: 'Deploy to GitHub Pages - Build passed security analysis'