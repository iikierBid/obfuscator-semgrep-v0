rules:
  - id: js-sql-injection-in-variable
    languages:
      - javascript
    severity: ERROR
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada.
      
      Query SQL construída com concatenação de string em uma variável com nome 
      sugestivo (query/sql). Use Prepared Statements ou ORMs para evitar
      ataques de injeção de SQL.
    patterns:
      - pattern-either:
          - pattern: |
              $QUERY = "..." + $...;
          - pattern: |
              $QUERY = `...` + $...;
          - pattern: |
              $QUERY = `...${$...}...`;
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?i)query|sql