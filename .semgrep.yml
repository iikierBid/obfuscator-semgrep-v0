# Configuração complementar ao p/default do Semgrep
# Estas regras cobrem lacunas específicas não cobertas pelo p/default

rules:
  # SQL Injection via concatenação de strings - complementa o p/default
  - id: sql-injection-string-concatenation
    pattern-either:
      # Padrão 1: Concatenação com string contendo SQL no início
      - patterns:
          - pattern: $QUERY = $SQL + $VAR + $MORE
          - metavariable-pattern:
              metavariable: $SQL
              pattern-regex: '"[^"]*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION)[^"]*"'
      # Padrão 2: Concatenação simples string + var
      - patterns:
          - pattern: $QUERY = $SQL + $VAR
          - metavariable-pattern:
              metavariable: $SQL
              pattern-regex: '"[^"]*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION)[^"]*"'
      # Padrão 3: Template literals
      - patterns:
          - pattern: $QUERY = `$TEMPLATE`
          - metavariable-pattern:
              metavariable: $TEMPLATE
              pattern-regex: '.*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION).*\$\{.*\}.*'
      # Padrão 4: Concatenação com aspas simples
      - patterns:
          - pattern: $QUERY = $SQL + $VAR + $MORE
          - metavariable-pattern:
              metavariable: $SQL
              pattern-regex: "'[^']*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION)[^']*'"
      # Padrão 5: Padrão simples para pegar casos gerais
      - patterns:
          - pattern-either:
              - pattern: const $VAR = "..." + $INPUT + "..."
              - pattern: let $VAR = "..." + $INPUT + "..."
              - pattern: var $VAR = "..." + $INPUT + "..."
          - metavariable-pattern:
              metavariable: $VAR
              pattern-regex: '.*(?i)(query|sql|cmd|command).*'
          - pattern-inside: |
              $FUNC(...) {
                ...
                $STMT
                ...
              }
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada!
      
      A construção de queries SQL através de concatenação direta permite que atacantes
      injetem código SQL malicioso, potencialmente expondo ou modificando dados.
      
      ⚠️  Código vulnerável detectado:
      const query = "SELECT * FROM users WHERE id = '" + userInput + "'";
      
      💥 Ataques possíveis:
      userInput = "'; DROP TABLE users; --"
      → query = "SELECT * FROM users WHERE id = ''; DROP TABLE users; --'"
      
      ✅ Soluções recomendadas:
      1. Prepared Statements: db.query("SELECT * FROM users WHERE id = ?", [userInput])
      2. ORMs seguros: User.findOne({ where: { id: userInput } })
      3. Validação rigorosa: if (!Number.isInteger(userInput)) throw Error()
      
      📚 OWASP A03:2021 - Injection | CWE-89
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: injection
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"

  # SQL Injection - Regra simples e direta
  - id: sql-injection-simple
    patterns:
      - pattern-either:
          - pattern: $VAR = "SELECT ..." + $INPUT + "..."
          - pattern: $VAR = "INSERT ..." + $INPUT + "..."
          - pattern: $VAR = "UPDATE ..." + $INPUT + "..."
          - pattern: $VAR = "DELETE ..." + $INPUT + "..."
          - pattern: $VAR = "DROP ..." + $INPUT + "..."
          - pattern: |
              $VAR = "..." + $INPUT + "...";
              console.log($MSG, $VAR);
    message: |
      🚨 SQL Injection: Concatenação de string detectada em query SQL!
      
      Detectada construção de query SQL usando concatenação de strings, o que pode
      permitir ataques de SQL injection.
      
      Solução: Use prepared statements ou parameterized queries.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"

  # SQL Injection - Regra específica para o nosso caso
  - id: sql-injection-exact-match
    pattern: |
      const $VAR = "SELECT * FROM users WHERE username = '" + $INPUT + "';"
    message: |
      🎯 SQL Injection CONFIRMADA! 
      
      Esta é exatamente a vulnerabilidade que estávamos procurando.
      Query SQL construída com concatenação direta de entrada do usuário.
      
      RISCO CRÍTICO: Permite bypass de autenticação e extração de dados.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      owasp: "A03:2021 - Injection"

  # Detecção de hash MD5/SHA1 fraco - complementa o p/default  
  - id: weak-hash-algorithms
    patterns:
      - pattern-either:
          - pattern: md5($DATA)
          - pattern: sha1($DATA)
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash('sha1')
          - pattern: new MD5($DATA)
          - pattern: new SHA1($DATA)
    message: |
      Uso de algoritmo de hash criptograficamente fraco detectado.
      MD5 e SHA1 são considerados inseguros devido a vulnerabilidades de colisão conhecidas.
      
      Recomendações:
      - Use SHA-256, SHA-3, ou BLAKE2 para novos projetos
      - Para senhas, use bcrypt, scrypt, ou Argon2
      - Para assinaturas digitais, use SHA-256 ou superior
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      subcategory: crypto
      confidence: HIGH
      impact: MEDIUM
      likelihood: MEDIUM
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  # Path Traversal genérico - complementa o p/default
  - id: path-traversal-generic
    patterns:
      - pattern-either:
          - pattern: $PATH = $INPUT + "$FILE"
          - pattern: $PATH = "$DIR" + $INPUT
          - pattern: fs.readFile($INPUT)
          - pattern: fs.readFileSync($INPUT)
      - metavariable-pattern:
          metavariable: $INPUT
          patterns:
            - pattern-regex: ".*\\.\\./.*"
    message: |
      Possível vulnerabilidade de Path Traversal detectada.
      O uso de entrada do usuário para construir caminhos de arquivo pode permitir
      acesso a arquivos fora do diretório pretendido.
      
      Recomendações:
      - Valide e normalize todos os caminhos de arquivo
      - Use uma whitelist de arquivos/diretórios permitidos
      - Implemente verificações de limite de diretório
      - Use path.resolve() para normalizar caminhos
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: path-traversal
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control" 