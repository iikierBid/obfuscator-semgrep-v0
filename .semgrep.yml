rules:
  - id: custom-js-sql-injection-vars
    languages: [javascript]
    severity: ERROR
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada.
      
      Query SQL construída com concatenação de string em uma variável com nome 
      sugestivo (query/sql). Use Prepared Statements.
    patterns:
      - pattern-either:
          - pattern: |
              $QUERY = "... " + $INPUT;
          - pattern: |
              $QUERY = `...` + $INPUT;
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?i)query|sql