rules:
  - id: javascript-sql-injection-by-function-name
    languages:
      - javascript
    severity: ERROR
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada.
      Uma query SQL parece estar sendo construída com concatenação de strings
      dentro de uma função com nome suspeito ('sql', 'query', etc.).
      Esta é uma prática extremamente perigosa.

      ✅ Solução: Use Prepared Statements ou ORMs para todas as queries.
    patterns:
      - pattern-either:
          - pattern: |
              "..." + $INPUT
          - pattern: |
              `...${$INPUT}...`
      - pattern-inside: |
          function $FUNC(...) { ... }
      - metavariable-regex:
          metavariable: $FUNC
          regex: (?i)sql