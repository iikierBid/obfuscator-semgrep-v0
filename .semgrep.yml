# Configuração complementar ao p/default do Semgrep
# Estas regras cobrem lacunas específicas não cobertas pelo p/default

rules:
  # SQL Injection - Regra unificada e robusta 
  - id: sql-injection-detection
    pattern-either:
      # Concatenação básica com keywords SQL
      - patterns:
          - pattern-either:
              - pattern: const $VAR = $STR + $INPUT + $MORE
              - pattern: let $VAR = $STR + $INPUT + $MORE  
              - pattern: var $VAR = $STR + $INPUT + $MORE
              - pattern: $VAR = $STR + $INPUT + $MORE
          - metavariable-pattern:
              metavariable: $STR
              pattern-regex: '"[^"]*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION|FROM|WHERE)[^"]*"'
      # Template literals com SQL
      - patterns:
          - pattern: $VAR = `$TEMPLATE`
          - metavariable-pattern:
              metavariable: $TEMPLATE
              pattern-regex: '.*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION).*\$\{.*\}.*'
      # Concatenação com aspas simples
      - patterns:
          - pattern-either:
              - pattern: const $VAR = $STR + $INPUT + $MORE
              - pattern: let $VAR = $STR + $INPUT + $MORE  
              - pattern: var $VAR = $STR + $INPUT + $MORE
              - pattern: $VAR = $STR + $INPUT + $MORE
          - metavariable-pattern:
              metavariable: $STR
              pattern-regex: "'[^']*(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION|FROM|WHERE)[^']*'"
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada!
      
      A construção de queries SQL através de concatenação direta permite que atacantes
      injetem código SQL malicioso, comprometendo a segurança do banco de dados.
      
      ⚠️  Exemplo de ataque:
      userInput = "'; DROP TABLE users; --"
      → query = "SELECT * FROM users WHERE id = ''; DROP TABLE users; --'"
      
      ✅ Soluções recomendadas:
      1. Prepared Statements: db.query("SELECT * FROM users WHERE id = ?", [userInput])
      2. ORMs seguros: User.findOne({ where: { id: userInput } })
      3. Validação rigorosa de entradas
      4. Sanitização com whitelist de caracteres permitidos
      
      📚 OWASP A03:2021 - Injection | CWE-89
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: injection
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"

  # Detecção de hash MD5/SHA1 fraco - complementa o p/default  
  - id: weak-hash-algorithms
    patterns:
      - pattern-either:
          - pattern: md5($DATA)
          - pattern: sha1($DATA)
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash('sha1')
          - pattern: new MD5($DATA)
          - pattern: new SHA1($DATA)
    message: |
      Uso de algoritmo de hash criptograficamente fraco detectado.
      MD5 e SHA1 são considerados inseguros devido a vulnerabilidades de colisão conhecidas.
      
      Recomendações:
      - Use SHA-256, SHA-3, ou BLAKE2 para novos projetos
      - Para senhas, use bcrypt, scrypt, ou Argon2
      - Para assinaturas digitais, use SHA-256 ou superior
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      subcategory: crypto
      confidence: HIGH
      impact: MEDIUM
      likelihood: MEDIUM
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  # Path Traversal genérico - complementa o p/default
  - id: path-traversal-generic
    patterns:
      - pattern-either:
          - pattern: $PATH = $INPUT + "$FILE"
          - pattern: $PATH = "$DIR" + $INPUT
          - pattern: fs.readFile($INPUT)
          - pattern: fs.readFileSync($INPUT)
      - metavariable-pattern:
          metavariable: $INPUT
          patterns:
            - pattern-regex: ".*\\.\\./.*"
    message: |
      Possível vulnerabilidade de Path Traversal detectada.
      O uso de entrada do usuário para construir caminhos de arquivo pode permitir
      acesso a arquivos fora do diretório pretendido.
      
      Recomendações:
      - Valide e normalize todos os caminhos de arquivo
      - Use uma whitelist de arquivos/diretórios permitidos
      - Implemente verificações de limite de diretório
      - Use path.resolve() para normalizar caminhos
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: path-traversal
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"

  # Credenciais hardcoded em arquivos YAML - complementa o p/default
  - id: hardcoded-credentials-yaml
    patterns:
      - pattern-either:
          # Senhas e tokens em YAML
          - pattern: |
              password: $VALUE
          - pattern: |
              passwd: $VALUE
          - pattern: |
              secret: $VALUE
          - pattern: |
              token: $VALUE
          - pattern: |
              api_key: $VALUE
          - pattern: |
              apikey: $VALUE
          - pattern: |
              private_key: $VALUE
          - pattern: |
              secret_key: $VALUE
          # Chaves de acesso
          - pattern: |
              access_key: $VALUE
          - pattern: |
              client_secret: $VALUE
          - pattern: |
              auth_token: $VALUE
          # Usernames de banco de dados
          - pattern: |
              username: $VALUE
          - pattern: |
              user: $VALUE
          - pattern: |
              db_user: $VALUE
      - metavariable-pattern:
          metavariable: $VALUE
          patterns:
            - pattern-not: ""
            - pattern-not: "***"
            - pattern-not: "****"
            - pattern-not: "${...}"
            - pattern-not: "$${...}"
            - pattern-not: "#{...}"
            - pattern-regex: '.{3,}'  # Pelo menos 3 caracteres
    message: |
      🚨 CREDENCIAIS HARDCODED DETECTADAS!
      
      Encontradas credenciais sensíveis (senhas, tokens, chaves) hardcoded em arquivo
      de configuração. Isso representa um risco crítico de segurança.
      
      ⚠️  Riscos:
      • Exposição de credenciais no controle de versão (Git)
      • Acesso não autorizado a sistemas e bancos de dados
      • Violação de compliance e regulamentações
      
      ✅ Soluções recomendadas:
      1. Variáveis de ambiente: password: ${DB_PASSWORD}
      2. Vaults seguros: HashiCorp Vault, AWS Secrets Manager
      3. Ferramentas de config: Spring Cloud Config, Kubernetes Secrets
      4. Nunca committar credenciais reais no código
      
      🔧 Exemplo seguro:
      datasource:
        username: ${DB_USERNAME:defaultuser}
        password: ${DB_PASSWORD}
      
      📚 OWASP A07:2021 - Identification and Authentication | CWE-798
    languages: [yaml]
    severity: ERROR
    metadata:
      category: security
      subcategory: secrets
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"

  # URLs de banco de dados com credenciais inline
  - id: database-url-with-credentials
    patterns:
      - pattern-either:
          - pattern: |
              url: jdbc:$DRIVER://$USER:$PASS@$HOST
          - pattern: |
              connectionString: $PROTOCOL://$USER:$PASS@$HOST
          - pattern: |
              database_url: $PROTOCOL://$USER:$PASS@$HOST
          - pattern: |
              connection_string: $PROTOCOL://$USER:$PASS@$HOST
    message: |
      🚨 CREDENCIAIS DE BANCO EM URL DETECTADAS!
      
      URL de banco de dados contém credenciais inline, expondo usuário e senha
      diretamente na string de conexão.
      
      ⚠️  Riscos críticos:
      • Credenciais visíveis em logs de aplicação
      • Exposição no controle de versão
      • Acesso não autorizado ao banco de dados
      
      ✅ Soluções recomendadas:
      1. Separar credenciais: url + username + password
      2. Variáveis de ambiente para credenciais
      3. Connection pools com configuração externa
      
      🔧 Exemplo seguro:
      datasource:
        url: jdbc:oracle:thin:@${DB_HOST}:${DB_PORT}:${DB_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
      
      📚 OWASP A07:2021 - Identification and Authentication | CWE-798
    languages: [yaml]
    severity: ERROR
    metadata:
      category: security
      subcategory: secrets
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"