rules:
  # SQL Injection - Concatenação de strings com palavras SQL
  - id: sql-injection-string-concat
    languages:
      - javascript
      - typescript
      - python
      - java
      - csharp
      - php
      - go
      - ruby
    severity: ERROR
    message: |
      🚨 SQL INJECTION DETECTADA!
      Query SQL sendo construída com concatenação de strings.
      Use prepared statements para evitar ataques de injeção.
    patterns:
      - pattern-either:
          - pattern: |
              "..." + $VAR
          - pattern: |
              $VAR + "..."
          - pattern: |
              f"...{$VAR}..."
          - pattern: |
              `...${$VAR}...`
          - pattern: |
              "..." % $VAR
      - pattern-regex: (?i)(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE)

  # Credenciais Hardcoded
  - id: hardcoded-credentials-universal
    languages:
      - javascript
      - typescript
      - python
      - java
      - csharp
      - php
      - go
      - ruby
      - yaml
      - json
    severity: ERROR
    message: |
      🚨 CREDENCIAL HARDCODED DETECTADA!
      Credencial sensível encontrada no código. Use variáveis de ambiente.
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = "..."
          - pattern: |
              const $VAR = "..."
          - pattern: |
              let $VAR = "..."
          - pattern: |
              var $VAR = "..."
          - pattern: |
              $VAR: "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(PASSWORD|SECRET|KEY|TOKEN|API).*