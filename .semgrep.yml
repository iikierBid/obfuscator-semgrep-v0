rules:
  - id: javascript-sql-injection-simplified
    languages:
      - javascript
    severity: ERROR
    message: |
      🚨 VULNERABILIDADE CRÍTICA: SQL Injection detectada!

      A construção de queries SQL através da concatenação direta de input do usuário
      permite que atacantes injetem código SQL malicioso.

      ✅ Solução: Use Prepared Statements ou ORMs.
    patterns:
      - pattern-either:
          - pattern: |
              "..." + $INPUT
          - pattern: |
              `...${$INPUT}...`
      - pattern-inside: |
          function $FUNC(...) {
            ...
            const $QUERY = ...;
            ...
          }
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?i)(SELECT|INSERT|UPDATE|DELETE)
      - focus-metavariable: $INPUT