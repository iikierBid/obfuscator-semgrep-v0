# Configuração genérica do Semgrep para múltiplos projetos
# Este arquivo pode ser personalizado para cada projeto específico

# Rulesets a serem aplicados (auto-detecta linguagens)
rules:
  # Regras genéricas de segurança - aplicáveis a qualquer linguagem
  - id: hardcoded-secret-detection
    patterns:
      - pattern-either:
          - pattern: password = "$SECRET"
          - pattern: token = "$SECRET"
          - pattern: api_key = "$SECRET"
          - pattern: secret = "$SECRET"
          - pattern: key = "$SECRET"
      - metavariable-pattern:
          metavariable: $SECRET
          patterns:
            - pattern-not: ""
            - pattern-not: "..."
            - pattern-not: "TODO"
            - pattern-not: "CHANGE_ME"
            - pattern-regex: '.{8,}'
    message: |
      Possível credencial hardcoded detectada.
      
      Riscos de segurança:
      - Exposição de credenciais no código-fonte
      - Acesso não autorizado a sistemas
      - Dificuldade de rotação de credenciais
      
      Melhores práticas:
      - Use variáveis de ambiente para credenciais
      - Implemente gerenciamento de segredos (HashiCorp Vault, AWS Secrets Manager)
      - Nunca commite credenciais no repositório
      - Use ferramentas como git-secrets para prevenção
    languages: [javascript, python, java, go, ruby, php, typescript, yaml, json]
    severity: ERROR
    metadata:
      category: security
      subcategory: secrets
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: generic-high-entropy-secret
    message: |
      Possível segredo de alta entropia detectado.
      Um valor com alta aleatoriedade foi encontrado, o que é característico de chaves de API, tokens e outras credenciais.
      
      Riscos:
      - Exposição de credenciais que dão acesso a sistemas críticos.
      
      Ação Recomendada:
      - Verifique se este valor é realmente um segredo.
      - Se for, remova-o do código-fonte e armazene-o de forma segura, como em um gerenciador de segredos (ex: AWS Secrets Manager, HashiCorp Vault) ou em variáveis de ambiente.
    metadata:
      category: security
      subcategory: secrets
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-798: Use of Hard-coded Credentials"
    severity: WARNING
    languages:
      - generic
    patterns:
      - pattern-regex: (?i)['"][a-z0-9\-_.~+/=]{40,}['"]
      - pattern-not-regex: (?i)'.*https?://.*'
      - pattern-not-regex: (?i)".*https?://.*"
      - pattern-not-regex: (?i)(jwt|bearer|token)
      - pattern-not-regex: (?i)sha(1|256|512)
      - pattern-not-regex: (?i)md5
      - pattern-not-regex: (?i)from.*import
      - pattern-not-regex: (?i)BEGIN (RSA|OPENSSH) PRIVATE KEY

  - id: generic-sql-injection
    patterns:
      - pattern-either:
          - pattern: $QUERY = "$SQL" + $VAR
          - pattern: $QUERY = "$SQL" + $VAR + "$MORE"
          - pattern: $DB.query("$SQL" + $VAR)
          - pattern: $DB.execute("$SQL" + $VAR)
    message: |
      Possível vulnerabilidade de SQL Injection detectada.
      
      Riscos de segurança:
      - Execução de comandos SQL não autorizados
      - Acesso a dados sensíveis
      - Modificação/exclusão de dados
      - Bypass de autenticação
      
      Melhores práticas:
      - Use prepared statements/parameterized queries
      - Valide e sanitize todas as entradas
      - Implemente o princípio do menor privilégio no banco
      - Use ORMs com proteção contra SQL injection
    languages: [javascript, python, java, go, ruby, php, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: injection
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"

  - id: generic-path-traversal
    patterns:
      - pattern-either:
          - pattern: $PATH = $INPUT + "$FILE"
          - pattern: $PATH = "$DIR" + $INPUT
          - pattern: open($INPUT)
          - pattern: read($INPUT)
      - metavariable-pattern:
          metavariable: $INPUT
          patterns:
            - pattern-either:
              - pattern: req.params.$VAR
              - pattern: request.params.$VAR
              - pattern: $_GET["$VAR"]
              - pattern: $_POST["$VAR"]
              - pattern: args.$VAR
    message: |
      Possível vulnerabilidade de Path Traversal detectada.
      
      Riscos de segurança:
      - Acesso a arquivos fora do diretório pretendido
      - Leitura de arquivos sensíveis do sistema
      - Exposição de código-fonte e configurações
      
      Melhores práticas:
      - Valide e sanitize nomes de arquivos
      - Use whitelist de arquivos/diretórios permitidos
      - Implemente controle de acesso baseado em função
      - Normalize paths antes de usar
    languages: [javascript, python, java, go, ruby, php, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: path-traversal
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"

# Configurações específicas por projeto podem ser adicionadas aqui
